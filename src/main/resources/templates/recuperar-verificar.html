<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>FIMACOR | Verificar Código</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/Estyle.css/fimacor-theme.css}">
  <script th:src="@{/Script.js/Fimacor_effects.js}" defer></script>
  <script th:src="@{/Script.js/Verificar_codigo.js}" defer></script>
</head>
<body class="verificarcodigo-form d-flex align-items-center justify-content-center min-vh-100 bg-dark p-3">

  <div class="verificarcodigo-container col-12 col-sm-9 col-md-7 col-lg-5 col-xl-4 bg-body-tertiary rounded-4 shadow-lg border-top border-4 border-success px-4 py-4 px-md-5">

    <div class="text-center mb-2">
      <img alt="Logo SENA" th:src="@{/Img/Sena.png}" width="96" height="96" class="object-fit-contain"/>
    </div>

    <h2 class="h3 text-success text-center mb-2">Verificar Código</h2>
    <p class="small text-secondary text-center mb-4">
      Ingresa el código de 6 dígitos que enviamos a tu correo y tu nueva contraseña.
    </p>

    <form id="formCambiarContrasena" th:action="@{/recuperar/verificar}" method="post">

      <div class="mb-3">
        <label for="codigo" class="form-label small fw-bold text-success mb-1">Código de verificación</label>
        <input type="text" id="codigo" name="codigo" class="form-control py-2" placeholder="Ej: 123456" maxlength="6" required>
      </div>

      <div class="mb-3">
        <label for="nuevaPassword" class="form-label small fw-bold text-success mb-1">Nueva contraseña</label>
        <div class="pass-wrapper position-relative">
          <input type="password" id="nuevaPassword" name="nuevaPassword" class="form-control py-2 pe-5" placeholder="Ingrese su nueva contraseña" required>
          <span class="toggle-pass position-absolute top-50 end-0 translate-middle-y me-3 d-flex text-success" role="button" onclick="toggleVer('nuevaPassword', this)"></span>
        </div>
      </div>

      <div class="mb-4">
        <label for="confirmar" class="form-label small fw-bold text-success mb-1">Confirmar contraseña</label>
        <div class="pass-wrapper position-relative">
          <input type="password" id="confirmar" name="confirmar" class="form-control py-2 pe-5" placeholder="Repita su nueva contraseña" required>
          <span class="toggle-pass position-absolute top-50 end-0 translate-middle-y me-3 d-flex text-success" role="button" onclick="toggleVer('confirmar', this)"></span>
        </div>

        <span class="errorverificarcodigo-msg d-none small fw-semibold mt-2" id="errorPass"></span>
      </div>

      <div class="d-grid">
        <button type="button" class="btn btn-success fw-bold py-2" id="btnCambiarContrasena">
          Cambiar Contraseña
        </button>
      </div>
    </form>

    <form th:action="@{/recuperar/reenviar}" method="post" class="d-grid mt-2">
      <button type="submit" class="btn btn-outline-success fw-bold py-2">
        Reenviar código
      </button>
      <p class="small text-secondary text-center mt-2 mb-0" id="timer-msg"></p>
    </form>

    <div class="text-center mt-3">
      <a th:href="@{/recuperar}" class="link-success fw-bold small text-decoration-none">&larr; Volver</a>
    </div>

    <footer class="text-center small text-secondary mt-4">
      &copy; 2026 FIMACOR Sistema de Control de Máquinas Textiles | CMTC - SENA
    </footer>

  </div>

  <div class="modal-login modal d-block d-none bg-dark bg-opacity-75" id="modalCambiarContrasena">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 rounded-4 shadow-lg p-4 text-center">
        <div class="loader spinner-border text-success mx-auto mb-3" role="status"></div>
        <h3 class="h5 fw-bold">Cambiando contraseña</h3>
        <p class="text-secondary mb-0">Validando código y actualizando contraseña...</p>
      </div>
    </div>
  </div>

</body>
</html>
