<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <script th:src="@{/Script.js/fimacor-zoom.js}"></script>
  <meta http-equiv="refresh" th:content="'1;url=/FichaTecnicaPublicaPdfServlet?id=' + ${id}"/>
  <meta name="robots" content="noindex, nofollow, noarchive"/>
  <title>Generando ficha técnica | FIMACOR</title>
  <th:block th:replace="~{fragments/qr-material :: recursos}"></th:block>
</head>
<body class="md-body">
  <main class="md-page md-page--center">
    <section class="md-loader-card" aria-live="polite" data-md-stagger>
      <span class="md-top-app-bar__logo"><img th:src="@{/Img/Sena.png}" alt="SENA"/></span>
      <div class="md-stack md-stack--center">
        <svg class="md-progress-circular" viewBox="0 0 48 48" role="progressbar" aria-label="Cargando"><circle cx="24" cy="24" r="20"/></svg>
      </div>
      <div>
        <span class="md-label-small md-muted md-row md-row--center"><span class="md-icon md-icon--sm" aria-hidden="true">picture_as_pdf</span>Ficha técnica</span>
        <h1 class="md-headline-small">Generando ficha técnica</h1>
        <p class="md-body-medium md-muted">Estamos preparando el PDF con la información técnica de la máquina.</p>
      </div>
      <div class="md-progress-linear" aria-hidden="true"></div>
      <a class="md-btn md-btn--tonal md-btn--block" th:href="@{/FichaTecnicaPublicaPdfServlet(id=${id})}"><span class="md-icon" aria-hidden="true">arrow_forward</span><span>Abrir ficha ahora</span></a>
    </section>
    <footer th:replace="~{fragments/qr-material :: pie}"></footer>
  </main>
  <script th:replace="~{fragments/qr-material :: scripts}"></script>
  <script th:inline="javascript">
    setTimeout(function () { location.replace(/*[[@{/FichaTecnicaPublicaPdfServlet(id=${id})}]]*/ ''); }, 700);
  </script>
</body>
</html>
