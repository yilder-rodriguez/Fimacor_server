<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>FIMACOR | Algo salió mal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/Estyle.css/fimacor-theme.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">
  <main class="card shadow-sm border-0 text-center p-4" style="max-width: 28rem; width: 100%;">
    <img th:src="@{/Img/Sena.png}" alt="SENA" width="56" height="56" class="mx-auto mb-3" style="object-fit: contain;">
    <h1 class="h4 fw-bold mb-2"
        th:text="${status == 404} ? 'No encontramos esa página'
               : (${status == 403} ? 'No tienes acceso a esta página'
               : 'Algo salió mal')">Algo salió mal</h1>
    <p class="text-secondary small mb-4"
       th:text="${status == 404} ? 'La dirección no existe o fue cambiada.'
              : (${status == 403} ? 'Tu cuenta no tiene permiso para esto, o la página estuvo abierta demasiado tiempo. Intenta entrar de nuevo.'
              : 'Ocurrió un problema inesperado. Intenta de nuevo; si sigue pasando, avisa al administrador.')">Ocurrió un problema inesperado.</p>
    <div class="d-grid gap-2">
      <a class="btn btn-success" th:href="@{/menu}">Ir al inicio</a>
      <a class="btn btn-outline-secondary" th:href="@{/login}">Ir al inicio de sesión</a>
    </div>
  </main>
</body>
</html>
